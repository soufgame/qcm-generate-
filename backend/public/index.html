<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QCM Générateur PDF</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      background: white;
      border-radius: 15px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      overflow: hidden;
    }

    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 30px;
      text-align: center;
    }

    .header h1 {
      font-size: 2em;
      margin-bottom: 10px;
    }

    .header p {
      font-size: 1.1em;
      opacity: 0.9;
    }

    .content {
      padding: 30px;
    }

    .upload-section {
      background: #f8f9fa;
      border-radius: 10px;
      padding: 30px;
      text-align: center;
      border: 2px dashed #667eea;
      margin-bottom: 30px;
    }

    .upload-section h3 {
      color: #2d3748;
      margin-bottom: 20px;
    }

    .file-input-wrapper {
      position: relative;
      display: inline-block;
      margin-bottom: 15px;
    }

    .file-input-wrapper input[type="file"] {
      position: absolute;
      opacity: 0;
      width: 100%;
      height: 100%;
      cursor: pointer;
    }

    .file-input-label {
      display: inline-block;
      padding: 12px 30px;
      background: white;
      border: 2px solid #667eea;
      border-radius: 8px;
      color: #667eea;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }

    .file-input-label:hover {
      background: #667eea;
      color: white;
    }

    .file-name {
      display: block;
      margin-top: 10px;
      color: #4a5568;
      font-size: 0.9em;
    }

    .question-card {
      background: #f8f9fa;
      border-radius: 10px;
      padding: 25px;
      margin-bottom: 25px;
      border-left: 5px solid #667eea;
      transition: transform 0.2s;
    }

    .question-card:hover {
      transform: translateX(5px);
    }

    .question-title {
      font-size: 1.2em;
      font-weight: 600;
      color: #2d3748;
      margin-bottom: 20px;
      line-height: 1.5;
    }

    .question-number {
      display: inline-block;
      background: #667eea;
      color: white;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.9em;
      margin-right: 10px;
    }

    .options {
      display: grid;
      gap: 12px;
    }

    .option {
      display: flex;
      align-items: center;
      padding: 15px;
      background: white;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .option:hover {
      border-color: #667eea;
      background: #f7fafc;
    }

    .option input[type="radio"] {
      margin-right: 12px;
      width: 20px;
      height: 20px;
      cursor: pointer;
    }

    .option label {
      cursor: pointer;
      flex: 1;
      font-size: 1em;
      color: #4a5568;
    }

    .option.correct {
      background: #d4edda;
      border-color: #28a745;
    }

    .option.incorrect {
      background: #f8d7da;
      border-color: #dc3545;
    }

    .option.neutral {
      background: #fff3cd;
      border-color: #ffc107;
    }

    .buttons {
      display: flex;
      gap: 15px;
      justify-content: center;
      margin-top: 30px;
      flex-wrap: wrap;
    }

    button {
      padding: 15px 40px;
      font-size: 1.1em;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    .btn-generate {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .btn-generate:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
    }

    .btn-verify {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .btn-verify:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
    }

    .btn-reset {
      background: #6c757d;
      color: white;
    }

    .btn-reset:hover {
      background: #5a6268;
      transform: translateY(-2px);
    }

    .btn-retry {
      background: #28a745;
      color: white;
    }

    .btn-retry:hover {
      background: #218838;
      transform: translateY(-2px);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .results {
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      color: white;
      padding: 30px;
      border-radius: 10px;
      margin-bottom: 30px;
      text-align: center;
    }

    .results h2 {
      font-size: 2em;
      margin-bottom: 20px;
    }

    .score-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    .score-item {
      background: rgba(255,255,255,0.2);
      padding: 20px;
      border-radius: 8px;
      backdrop-filter: blur(10px);
    }

    .score-item .label {
      font-size: 0.9em;
      opacity: 0.9;
      margin-bottom: 5px;
    }

    .score-item .value {
      font-size: 2em;
      font-weight: bold;
    }

    .correct-answer {
      margin-top: 10px;
      padding: 10px;
      background: #e7f3ff;
      border-left: 4px solid #0066cc;
      border-radius: 5px;
      color: #004085;
      font-weight: 500;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #667eea;
      font-size: 1.2em;
    }

    .error {
      background: #f8d7da;
      color: #721c24;
      padding: 20px;
      border-radius: 8px;
      border-left: 4px solid #dc3545;
      margin-bottom: 20px;
    }

    @media (max-width: 768px) {
      .header h1 {
        font-size: 1.5em;
      }
      
      .question-title {
        font-size: 1em;
      }
      
      .buttons {
        flex-direction: column;
      }
      
      button {
        width: 100%;
      }
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>📄 Générateur QCM PDF</h1>
      <p>Uploadez votre PDF pour générer un QCM interactif</p>
    </div>

    <div class="content">
      <div id="uploadSection" class="upload-section">
        <h3>📤 Sélectionnez votre fichier PDF</h3>
        <form id="pdfForm">
          <div class="file-input-wrapper">
            <input type="file" name="pdf" accept=".pdf" required id="fileInput" />
            <label class="file-input-label" for="fileInput">Choisir un fichier PDF</label>
          </div>
          <span class="file-name" id="fileName">Aucun fichier sélectionné</span>
          <div style="margin-top: 20px;">
            <button type="submit" class="btn-generate">Générer le QCM</button>
          </div>
        </form>
      </div>

      <div id="loadingSection" class="loading hidden">
        <p>⏳ Génération du QCM en cours...</p>
      </div>

      <div id="errorSection" class="error hidden"></div>

      <div id="results" class="results hidden"></div>
      <div id="qcmForm"></div>
      <div class="buttons" id="actionButtons" style="display: none;">
        <button type="button" class="btn-verify" id="verifyBtn">Vérifier mes réponses</button>
        <button type="button" class="btn-reset hidden" id="resetBtn">Réinitialiser</button>
        <button type="button" class="btn-retry hidden" id="retryBtn">Refaire</button>
      </div>
    </div>
  </div>

  <script>
    let questions = [];
    let isVerified = false;

    const form = document.getElementById('pdfForm');
    const fileInput = document.getElementById('fileInput');
    const fileName = document.getElementById('fileName');
    const uploadSection = document.getElementById('uploadSection');
    const loadingSection = document.getElementById('loadingSection');
    const errorSection = document.getElementById('errorSection');
    const qcmForm = document.getElementById('qcmForm');
    const verifyBtn = document.getElementById('verifyBtn');
    const resetBtn = document.getElementById('resetBtn');
    const retryBtn = document.getElementById('retryBtn');
    const resultsDiv = document.getElementById('results');
    const actionButtons = document.getElementById('actionButtons');

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      fileName.textContent = file ? file.name : 'Aucun fichier sélectionné';
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = new FormData(form);

      uploadSection.classList.add('hidden');
      loadingSection.classList.remove('hidden');
      errorSection.classList.add('hidden');
      qcmForm.innerHTML = '';
      resultsDiv.classList.add('hidden');
      actionButtons.style.display = 'none';

      try {
        const res = await fetch('/api/qcm/generate', {
          method: 'POST',
          body: formData
        });
        
        const contentType = res.headers.get('content-type');
        const text = await res.text();
        
        let data;
        try {
          data = JSON.parse(text);
        } catch (parseErr) {
          throw new Error(`Response is not valid JSON. Content-Type: ${contentType}. Response: ${text.substring(0, 100)}`);
        }

        loadingSection.classList.add('hidden');

        if (data.qcm) {
          if (Array.isArray(data.qcm)) {
            questions = data.qcm;
          } else if (data.qcm.questions && Array.isArray(data.qcm.questions)) {
            questions = data.qcm.questions;
          } else {
            throw new Error("Structure QCM inattendue");
          }

          // Transformer les questions au format attendu
          questions = questions.map(q => ({
            question: q.question,
            options: q.options.map(o => o.text || o),
            correctIndex: q.options.findIndex(o => 
              (o.text || o) === (q.answer?.text || q.answer)
            )
          }));

          generateForm();
          actionButtons.style.display = 'flex';
        } else {
          throw new Error(data.error || "Erreur lors de la génération du QCM");
        }
      } catch (err) {
        loadingSection.classList.add('hidden');
        errorSection.classList.remove('hidden');
        errorSection.textContent = "❌ Erreur : " + err.message;
        uploadSection.classList.remove('hidden');
      }
    });

    function generateForm() {
      qcmForm.innerHTML = questions.map((q, qIndex) => `
        <div class="question-card" id="question-${qIndex}">
          <div class="question-title">
            <span class="question-number">Question ${qIndex + 1}</span>
            ${q.question}
          </div>
          <div class="options">
            ${q.options.map((opt, optIndex) => `
              <div class="option" onclick="selectOption(${qIndex}, ${optIndex})">
                <input type="radio" name="q${qIndex}" value="${optIndex}" id="q${qIndex}_${optIndex}">
                <label for="q${qIndex}_${optIndex}">${String.fromCharCode(65 + optIndex)}. ${opt}</label>
              </div>
            `).join('')}
          </div>
          <div class="correct-answer hidden" id="answer-${qIndex}"></div>
        </div>
      `).join('');
    }

    function selectOption(qIndex, optIndex) {
      if (isVerified) return;
      document.getElementById(`q${qIndex}_${optIndex}`).checked = true;
    }

    function verifyAnswers() {
      let correct = 0;
      let incorrect = 0;
      let unanswered = 0;

      questions.forEach((q, qIndex) => {
        const selected = document.querySelector(`input[name="q${qIndex}"]:checked`);
        const options = document.querySelectorAll(`#question-${qIndex} .option`);
        const answerDiv = document.getElementById(`answer-${qIndex}`);

        if (!selected) {
          unanswered++;
          options[q.correctIndex].classList.add('neutral');
          answerDiv.innerHTML = `✓ Réponse correcte : <strong>${String.fromCharCode(65 + q.correctIndex)}. ${q.options[q.correctIndex]}</strong>`;
          answerDiv.classList.remove('hidden');
        } else {
          const selectedIndex = parseInt(selected.value);
          if (selectedIndex === q.correctIndex) {
            correct++;
            options[selectedIndex].classList.add('correct');
          } else {
            incorrect++;
            options[selectedIndex].classList.add('incorrect');
            options[q.correctIndex].classList.add('correct');
          }
          answerDiv.innerHTML = `✓ Réponse correcte : <strong>${String.fromCharCode(65 + q.correctIndex)}. ${q.options[q.correctIndex]}</strong>`;
          answerDiv.classList.remove('hidden');
        }
      });

      const total = questions.length;
      const percentage = ((correct / total) * 100).toFixed(1);

      resultsDiv.innerHTML = `
        <h2>📊 Résultats du QCM</h2>
        <div class="score-grid">
          <div class="score-item">
            <div class="label">Score Total</div>
            <div class="value">${correct}/${total}</div>
          </div>
          <div class="score-item">
            <div class="label">Pourcentage</div>
            <div class="value">${percentage}%</div>
          </div>
          <div class="score-item">
            <div class="label">✓ Bonnes Réponses</div>
            <div class="value">${correct}</div>
          </div>
          <div class="score-item">
            <div class="label">✗ Mauvaises Réponses</div>
            <div class="value">${incorrect}</div>
          </div>
        </div>
      `;
      resultsDiv.classList.remove('hidden');

      isVerified = true;
      verifyBtn.classList.add('hidden');
      resetBtn.classList.remove('hidden');
      retryBtn.classList.remove('hidden');

      document.querySelectorAll('input[type="radio"]').forEach(input => {
        input.disabled = true;
      });
    }

    function resetQuiz() {
      isVerified = false;
      resultsDiv.classList.add('hidden');
      verifyBtn.classList.remove('hidden');
      resetBtn.classList.add('hidden');
      retryBtn.classList.add('hidden');

      document.querySelectorAll('input[type="radio"]').forEach(input => {
        input.disabled = false;
        input.checked = false;
      });

      document.querySelectorAll('.option').forEach(opt => {
        opt.classList.remove('correct', 'incorrect', 'neutral');
      });

      document.querySelectorAll('.correct-answer').forEach(ans => {
        ans.classList.add('hidden');
      });
    }

    verifyBtn.addEventListener('click', verifyAnswers);
    resetBtn.addEventListener('click', resetQuiz);
    retryBtn.addEventListener('click', resetQuiz);
  </script>
</body>
</html>
