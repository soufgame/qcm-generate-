<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QCM Générateur PDF</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <button class="btn-refresh" onclick="location.reload()" title="Rafraîchir la page">🔄</button>
      <h1>📄 Générateur QCM PDF</h1>
      <p>Uploadez votre PDF pour générer un QCM interactif</p>
    </div>

    <div class="content">
      <div id="uploadSection" class="upload-section">
        <h3>📤 Sélectionnez votre fichier PDF</h3>
        <form id="pdfForm">
          <div class="file-input-wrapper">
            <input type="file" name="pdf" accept=".pdf" required id="fileInput" />
            <label class="file-input-label" for="fileInput">Choisir un fichier PDF</label>
          </div>
          <span class="file-name" id="fileName">Aucun fichier sélectionné</span>
          
          <div style="margin-top: 20px; padding: 15px; background: white; border-radius: 8px; display: inline-block;">
            <label for="questionCount" style="color: #2d3748; font-weight: 600; margin-right: 10px;">Nombre de questions:</label>
            <input type="number" id="questionCount" name="questionCount" min="1" max="30" value="10" style="width: 80px; padding: 8px; border: 2px solid #667eea; border-radius: 5px; font-size: 1em;">
            <span style="color: #666; margin-left: 10px; font-size: 0.9em;">(Max: 30)</span>
          </div>
          
          <div style="margin-top: 20px;">
            <button type="submit" class="btn-generate">Générer le QCM</button>
          </div>
        </form>
      </div>

      <div id="loadingSection" class="loading hidden">
        <p>⏳ Génération du QCM en cours...</p>
      </div>

      <div id="errorSection" class="error hidden"></div>

      <div id="results" class="results hidden"></div>
      <div id="qcmForm"></div>
      <div class="buttons" id="actionButtons" style="display: none;">
        <button type="button" class="btn-verify" id="verifyBtn">Vérifier mes réponses</button>
        <button type="button" class="btn-reset hidden" id="resetBtn">Réinitialiser</button>
        <button type="button" class="btn-retry hidden" id="retryBtn">Refaire</button>
      </div>
    </div>
  </div>

  <script src="index.js"></script>
</body>
</html>
